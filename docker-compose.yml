# docker-compose de ObraSync (tarjeta #29: versión mínima para la demo).
#
# Levanta: SQL Server (una base por servicio), RabbitMQ, los 4 microservicios, el API Gateway y el frontend.
# Incluye el frontend (nginx, puerto 5173 provisorio). Para desarrollar con recarga rápida sigue valiendo `npm run dev`.
#
# Antes de levantar: copiar .env.example a .env y completar los valores (ver README).
# Los secretos y las cadenas de conexión llegan por variables de entorno; nunca van escritos acá.

services:
  # ── Infraestructura ────────────────────────────────────────────────────────

  # Una sola instancia de SQL Server con 4 bases (DB_Auth, DB_Req, DB_Licit, DB_Recepcion).
  # Cada servicio usa SOLO la suya; entre bases no hay claves foráneas (las referencias son GUID).
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Falta SQL_SA_PASSWORD en el archivo .env}
    ports:
      # 127.0.0.1: solo accesible desde esta computadora, no desde la red (#169).
      - "127.0.0.1:1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -b -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SET NOCOUNT ON; IF EXISTS (SELECT 1 FROM sys.databases WHERE state <> 0) RAISERROR('hay bases que todavia no estan en linea', 16, 1);\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Falta RABBITMQ_USER en el archivo .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?Falta RABBITMQ_PASS en el archivo .env}
    ports:
      # 127.0.0.1: solo accesible desde esta computadora, no desde la red (#169).
      - "127.0.0.1:5672:5672" # AMQP (los servicios)
      - "127.0.0.1:15672:15672" # panel de administración: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Microservicios ─────────────────────────────────────────────────────────
  # Dentro del contenedor cada servicio escucha en el 8080; afuera se publica en 5001 a 5004.

  usuarios-obras-api:
    build:
      context: ./services/usuarios-obras
      dockerfile: Dockerfile
    ports:
      # 127.0.0.1: solo accesible desde esta computadora (Swagger, scripts), no desde la red (#136).
      # Lo normal es entrar por el Gateway (5000). Los puertos 5002 a 5004 siguen el mismo criterio.
      - "127.0.0.1:5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=DB_Auth;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Secret: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}
    depends_on:
      sqlserver:
        condition: service_healthy

  requisiciones-catalogo-api:
    build:
      context: ./services/requisiciones-catalogo
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=DB_Req;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      UsuariosObras__BaseUrl: http://usuarios-obras-api:8080
      Jwt__Secret: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:?Falta RABBITMQ_USER en el archivo .env}
      RabbitMQ__Password: ${RABBITMQ_PASS:?Falta RABBITMQ_PASS en el archivo .env}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  licitaciones-cotizaciones-api:
    build:
      context: ./services/licitaciones-cotizaciones
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Este servicio lee la cadena con el nombre "DbLicit" (no "DefaultConnection").
      ConnectionStrings__DbLicit: "Server=sqlserver;Database=DB_Licit;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Secret: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:?Falta RABBITMQ_USER en el archivo .env}
      RabbitMQ__Password: ${RABBITMQ_PASS:?Falta RABBITMQ_PASS en el archivo .env}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  recepcion-presupuesto-api:
    build:
      context: ./services/recepcion-presupuesto
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=DB_Recepcion;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      UsuariosObras__BaseUrl: http://usuarios-obras-api:8080
      Jwt__Secret: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:?Falta RABBITMQ_USER en el archivo .env}
      RabbitMQ__Password: ${RABBITMQ_PASS:?Falta RABBITMQ_PASS en el archivo .env}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── Asistente de IA (#137) ─────────────────────────────────────────────────
  # Chat con un modelo de lenguaje (gateway de IA de la cátedra). Solo LEE datos: nunca crea ni modifica nada.
  # Usa el JWT del usuario para consultar el catálogo POR el Gateway. Puerto 5005 (propuesto: pendiente de acordar con el equipo).
  # La clave y la URL de IA llegan por variables de entorno (.env): si faltan, el servicio arranca y el chat responde 503.
  asistente-api:
    build:
      context: ./asistente
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Jwt__Secret: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}
      Gateway__BaseUrl: http://gateway:8080
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__BaseUrl: ${AI_BASE_URL:-}
      Ai__Deployment: ${AI_DEPLOYMENT:-gpt-4.1-mini}
      # Modelo para leer remitos por foto (#209). Vacío = usa el mismo del chat; con un modelo más potente solo se cambia esto.
      Ai__DeploymentRemito: ${AI_DEPLOYMENT_REMITO:-}

  # ── API Gateway (YARP) ─────────────────────────────────────────────────────
  # En appsettings.json los destinos apuntan a localhost:5001 a 5004 (para correr sin Docker).
  # Acá se reemplazan por los nombres de los servicios de esta red de Docker.
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      # 127.0.0.1: solo accesible desde esta computadora, no desde la red (#169).
      - "127.0.0.1:5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ReverseProxy__Clusters__usuarios__Destinations__principal__Address: http://usuarios-obras-api:8080/
      ReverseProxy__Clusters__requisiciones__Destinations__principal__Address: http://requisiciones-catalogo-api:8080/
      ReverseProxy__Clusters__licitaciones__Destinations__principal__Address: http://licitaciones-cotizaciones-api:8080/
      ReverseProxy__Clusters__recepcion__Destinations__principal__Address: http://recepcion-presupuesto-api:8080/
      ReverseProxy__Clusters__asistente__Destinations__principal__Address: http://asistente-api:8080/
    depends_on:
      - usuarios-obras-api
      - requisiciones-catalogo-api
      - licitaciones-cotizaciones-api
      - recepcion-presupuesto-api
      - asistente-api

  # ── Frontend (React PWA servida por nginx) ─────────────────────────────────
  # nginx sirve la app y reenvía /api al Gateway, así que todo sale por la misma dirección.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # 127.0.0.1: solo desde esta computadora, igual que los servicios (#136).
      # El puerto 5173 es provisorio: acordarlo con el equipo.
      - "127.0.0.1:5173:8080"
    depends_on:
      - gateway

volumes:
  sql_data:
