services:
  usuarios-obras-api:
    build:
      context: ./services/usuarios-obras
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db-usuarios;Database=DB_Auth;User Id=sa;Password=PasswordSeguro123!;TrustServerCertificate=True;
    depends_on:
      - db-usuarios

  db-usuarios:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=PasswordSeguro123!
    ports:
      - "1433:1433"
    volumes:
      - sql_usuarios_data:/var/opt/mssql

volumes:
  sql_usuarios_data: