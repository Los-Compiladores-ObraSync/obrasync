server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Todo lo que empieza con /api va al Gateway. Como la app y la API salen por la misma dirección,
  # no hace falta CORS. Authorization y X-Correlation-ID pasan solos.
  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # PWA: el navegador siempre tiene que preguntar si hay una versión nueva de estos archivos.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js      { add_header Cache-Control "no-cache"; }

  # Archivos con hash en el nombre (los genera Vite): se pueden guardar "para siempre".
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Cualquier otra ruta de la app (/compras, /obra...) devuelve index.html: la resuelve React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}