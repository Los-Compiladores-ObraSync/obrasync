server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad (#199): X-Content-Type-Options, X-Frame-Options, Referrer-Policy y CSP.
  # Hay que repetir el include en cada location que tenga su propio add_header (ver el archivo).
  include /etc/nginx/snippets/cabeceras-seguridad.conf;

  # Fotos de evidencia de una entrega con problema (#224): hasta 3 fotos de 2 MB. El servicio de Recepción acepta
  # hasta 8 MB por pedido; con el límite general de 6 MB nginx cortaría con un 413 antes de que llegue.
  # Es un "location =" (ruta exacta): el resto de /api/ sigue con su límite de 6 MB.
  location = /api/recepciones/problemas {
    client_max_body_size 8m;
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Chat por orden en tiempo real (#225): SignalR usa WebSockets, que necesitan los encabezados Upgrade/Connection y una
  # lectura larga (la conexión queda abierta). Sin esto nginx la corta y el chat cae al respaldo de consulta cada 10 s.
  # Es un "location ^~": gana sobre el /api/ general para estas rutas. El token va en ?access_token= (no se escribe en logs).
  location ^~ /api/ordenes-compra/chat-hub {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    access_log off;
  }

  # Todo lo que empieza con /api va al Gateway. Como la app y la API salen por la misma dirección,
  # no hace falta CORS. Authorization y X-Correlation-ID pasan solos.
  location /api/ {
    # Foto del remito (#209): el servidor acepta hasta 5 MB; sin esto nginx corta todo lo que pase de 1 MB con un 413.
    client_max_body_size 6m;
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # PWA: el navegador siempre tiene que preguntar si hay una versión nueva de estos archivos.
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/cabeceras-seguridad.conf;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/cabeceras-seguridad.conf;
  }

  # Archivos con hash en el nombre (los genera Vite): se pueden guardar "para siempre".
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/cabeceras-seguridad.conf;
    try_files $uri =404;
  }

  # Cualquier otra ruta de la app (/compras, /obra...) devuelve index.html: la resuelve React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}