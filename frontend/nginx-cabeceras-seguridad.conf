# Cabeceras de seguridad (#199). Se incluye con "include" en el server y en cada location que tenga
# su propio add_header: en nginx, un add_header dentro de un location BORRA los que vienen del nivel
# de arriba, así que hay que repetirlas ahí. "always" las manda también en las respuestas de error.

# El navegador no adivina el tipo de archivo (evita que un texto se ejecute como script).
add_header X-Content-Type-Options "nosniff" always;
# Nadie puede meter la app dentro de un iframe (clickjacking).
add_header X-Frame-Options "DENY" always;
# No se manda de dónde venimos cuando se sale a otro sitio.
add_header Referrer-Policy "no-referrer" always;
# Solo se carga lo que sale de la misma dirección que la app (la API también sale por acá).
# - style-src 'unsafe-inline': la app usa estilos en línea (style={{...}}) en algunas pantallas.
# - connect-src con Nominatim: la pantalla de obras comprueba la dirección en nominatim.openstreetmap.org
#   (ubicacionService.ts). Si se saca ese servicio, sacar también esta línea.
# - img-src data: blob: por si se muestran imágenes generadas en el navegador.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://nominatim.openstreetmap.org; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
